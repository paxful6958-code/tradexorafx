<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tradexora - Admin Login</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-slate-950 text-slate-100 min-h-screen flex items-center justify-center font-sans">

    <div class="w-full max-w-md p-8 bg-slate-900 border border-slate-800 rounded-2xl shadow-2xl">

        <!-- Header -->
        <div class="text-center mb-8">
            <h1 class="text-2xl font-bold tracking-wider text-emerald-400">TRADEXORA</h1>
            <p class="text-slate-400 text-sm mt-1">Admin Portal Secure Login</p>
        </div>

        <!-- Login Form -->
        <form id="adminLoginForm" onsubmit="handleAdminLogin(event)" class="space-y-5">
            <div>
                <label class="block text-xs uppercase text-slate-400 font-semibold mb-2">Admin Email</label>
                <input type="email" id="email" required placeholder="admin@tradexora.com" class="w-full bg-slate-950 border border-slate-800 rounded-lg px-4 py-3 text-slate-100 placeholder-slate-600 focus:outline-none focus:border-emerald-500 transition">
            </div>

            <div>
                <label class="block text-xs uppercase text-slate-400 font-semibold mb-2">Password</label>
                <input type="password" id="password" required placeholder="••••••••••••" class="w-full bg-slate-950 border border-slate-800 rounded-lg px-4 py-3 text-slate-100 placeholder-slate-600 focus:outline-none focus:border-emerald-500 transition">
            </div>

            <div id="errorMessage" class="text-red-400 text-xs hidden bg-red-950/40 border border-red-900/50 p-3 rounded-lg text-center"></div>

            <button type="submit" id="loginBtn" class="w-full py-3 bg-emerald-600 hover:bg-emerald-500 text-white font-semibold rounded-lg shadow-lg shadow-emerald-600/20 transition duration-200">
        Sign In to Dashboard
      </button>
        </form>

        <div class="mt-6 text-center text-xs text-slate-500">
            Protected System • Authorized Personnel Only
        </div>
    </div>

    <!-- JavaScript Login Handler -->
    <script>
        // If already logged in, redirect straight to admin dashboard
        if (localStorage.getItem('tradexora_admin_id')) {
            window.location.href = '/admin';
        }

        async function handleAdminLogin(event) {
            event.preventDefault();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value.trim();
            const errorDiv = document.getElementById('errorMessage');
            const btn = document.getElementById('loginBtn');

            errorDiv.classList.add('hidden');
            btn.innerText = 'Authenticating...';
            btn.disabled = true;

            try {
                const response = await fetch('/api/admin/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        email,
                        password
                    })
                });

                const data = await response.json();

                if (data.success) {
                    // Save Admin ID securely in localStorage
                    localStorage.setItem('tradexora_admin_id', data.adminId);
                    window.location.href = '/admin';
                } else {
                    errorDiv.innerText = data.message || 'Invalid credentials or access denied.';
                    errorDiv.classList.remove('hidden');
                    btn.innerText = 'Sign In to Dashboard';
                    btn.disabled = false;
                }
            } catch (err) {
                console.error('Login error:', err);
                errorDiv.innerText = 'Network error. Please try again.';
                errorDiv.classList.remove('hidden');
                btn.innerText = 'Sign In to Dashboard';
                btn.disabled = false;
            }
        }
    </script>
</body>

</html>
